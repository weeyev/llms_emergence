  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);

}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

}

.text-warning,
.text-destructive {

t;,2023,&quot;EXCLUDE&quot;,&quot;TIER_3&quot;,0,&quot;&quot;,&quot;M08&quot;,&quot;synaptic / spiking / hebbian&quot;,&quot;S19&quot;,&quot;deep neural / detectors / emerge deep&quot;,-0.119324,-0.070051,0.0480596,0.01966647]]}&lt;/script&gt;

    (function () {
      &quot;use strict&quot;;

      var root = document.getElementById(&quot;emergence-paper-cluster-map&quot;);
      if (!root) {
        return;
      }

      var countLabel = root.querySelector(&quot;#epcm-count&quot;);
      var corpusControl = root.querySelector(&quot;#epcm-corpus&quot;);
      var methodControl = root.querySelector(&quot;#epcm-method&quot;);
      var legend = root.querySelector(&quot;#epcm-legend&quot;);
      var statusKey = root.querySelector(&quot;#epcm-status-key&quot;);
      var chartWrap = root.querySelector(&quot;#epcm-chart-wrap&quot;);
      var svgNode = root.querySelector(&quot;#epcm-chart&quot;);
      var description = root.querySelector(&quot;#epcm-chart-description&quot;);
      var tooltip = root.querySelector(&quot;#epcm-tooltip&quot;);
      var selectionLine = root.querySelector(&quot;#epcm-selection&quot;);
      var dataNode = document.getElementById(&quot;emergence-paper-cluster-map-data&quot;);

      if (!window.d3 || !dataNode || !countLabel || !corpusControl || !methodControl ||
          !legend || !statusKey || !chartWrap || !svgNode || !description ||
          !tooltip || !selectionLine) {
        selectionLine.textContent = &quot;The paper map could not be initialized.&quot;;
        return;
      }

      var payload = JSON.parse(dataNode.textContent);
      var points = payload.rows.map(function (row) {
        var item = {};
        payload.columns.forEach(function (column, index) {
          item[column] = row[index];
        });
        return item;
      });
      var d3 = window.d3;
      var svg = d3.select(svgNode);
      var seriesColors = [
        &quot;var(--viz-series-1)&quot;,
        &quot;var(--viz-series-2)&quot;,
        &quot;var(--viz-series-3)&quot;,
        &quot;var(--viz-series-4)&quot;,
        &quot;var(--viz-series-5)&quot;,
        &quot;var(--viz-series-6)&quot;
      ];
      var state = {
        corpus: corpusControl.value,
        method: methodControl.value,
        points: [],
        activeClusters: new Set(),
        selected: null
      };
      var resizeFrame = null;

      function colorForCluster(cluster) {
        var numericId = Number(cluster.slice(1));
        return seriesColors[(numericId - 1) % seriesColors.length];
      }

      function readableToken(value) {
        if (!value) {
          return &quot;&quot;;
        }
        return value
          .toLowerCase()
          .replaceAll(&quot;_&quot;, &quot; &quot;)
          .replace(/\b\w/g, function (letter) { return letter.toUpperCase(); });
      }

      function paddedDomain(values) {
        var extent = d3.extent(values);
        var span = extent[1] - extent[0];
        if (!Number.isFinite(span) || span === 0) {
          span = 1;
        }
        var pad = span * 0.08;
        return [extent[0] - pad, extent[1] + pad];
      }

      function renderSelection() {
        if (!state.selected) {
          selectionLine.textContent = &quot;Select a dot to pin its paper details.&quot;;
          return;
        }
        var paper = state.selected;
        var year = paper.year ? &quot; (&quot; + paper.year + &quot;)&quot; : &quot;&quot;;
        selectionLine.textContent =
          paper.title + year + &quot; — &quot; + paper.macro_cluster + &quot; / &quot; +
          paper.subcluster + &quot;; &quot; + paper.supported_count + &quot;/5 criteria supported.&quot;;
      }

      function hideTooltip() {
        tooltip.hidden = true;
      }

      function addTooltipLine(text, className) {
        var line = document.createElement(&quot;div&quot;);
        line.className = className || &quot;epcm-tooltip-line&quot;;
        line.textContent = text;
        tooltip.appendChild(line);
      }

      function showTooltip(event, paper) {
        tooltip.replaceChildren();
        var year = paper.year ? &quot; (&quot; + paper.year + &quot;)&quot; : &quot;&quot;;
        addTooltipLine(paper.title + year, &quot;epcm-tooltip-title&quot;);
        addTooltipLine(
          paper.macro_cluster + &quot; · &quot; + paper.macro_label +
          &quot; | &quot; + paper.subcluster + &quot; · &quot; + paper.subcluster_label
        );
        var auditParts = [readableToken(paper.verdict)];
        if (paper.tier) {
          auditParts.push(readableToken(paper.tier));
        }
        auditParts.push(paper.supported_count + &quot;/5 criteria supported&quot;);
        addTooltipLine(auditParts.join(&quot; · &quot;));
        if (paper.supported_criteria) {
          addTooltipLine(&quot;Supported: &quot; + readableToken(paper.supported_criteria));
        }
        addTooltipLine(
          &quot;Silhouette: macro &quot; + Number(paper.macro_silhouette).toFixed(3) +
          &quot; · subcluster &quot; + Number(paper.subcluster_silhouette).toFixed(3)
        );
        tooltip.hidden = false;

        var pointer = d3.pointer(event, chartWrap);
        var tooltipBounds = tooltip.getBoundingClientRect();
        var wrapBounds = chartWrap.getBoundingClientRect();
        var left = pointer[0] + 12;
        var top = pointer[1] - tooltipBounds.height - 12;
        if (left + tooltipBounds.width &gt; wrapBounds.width - 8) {
          left = pointer[0] - tooltipBounds.width - 12;
        }
        if (top &lt; 8) {
          top = pointer[1] + 12;
        }
        left = Math.max(8, Math.min(left, wrapBounds.width - tooltipBounds.width - 8));
        top = Math.max(8, top);
        tooltip.style.left = left + &quot;px&quot;;
        tooltip.style.top = top + &quot;px&quot;;
      }

      function drawLegend(clusterGroups) {
        legend.replaceChildren();
        clusterGroups.forEach(function (group) {
          var button = document.createElement(&quot;button&quot;);
          var swatch = document.createElement(&quot;span&quot;);
          var label = document.createElement(&quot;span&quot;);
          var cluster = group[0];
          var members = group[1];
          var clusterLabel = members[0].macro_label;
          button.type = &quot;button&quot;;
          button.className = &quot;epcm-legend-button text-small&quot;;
          button.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
          button.setAttribute(
            &quot;aria-label&quot;,
            cluster + &quot;, &quot; + clusterLabel + &quot;, &quot; + members.length + &quot; papers&quot;
          );
          swatch.className = &quot;epcm-legend-swatch&quot;;
          swatch.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
          swatch.style.setProperty(&quot;--epcm-cluster-color&quot;, colorForCluster(cluster));
          label.textContent = cluster + &quot; · &quot; + clusterLabel + &quot; (&quot; + members.length + &quot;)&quot;;
          button.append(swatch, label);
          button.addEventListener(&quot;click&quot;, function () {
            if (state.activeClusters.has(cluster)) {
              state.activeClusters.delete(cluster);
              button.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
            } else {
              state.activeClusters.add(cluster);
              button.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
            }
            hideTooltip();
            renderChart();
          });
          legend.appendChild(button);
        });
      }

      function nearestPoint(event, xScale, yScale, visiblePoints) {
        var pointer = d3.pointer(event, svgNode);
        var nearest = null;
        var nearestDistance = Infinity;
        visiblePoints.forEach(function (paper) {
          var dx = xScale(paper.mds_x) - pointer[0];
          var dy = yScale(paper.mds_y) - pointer[1];
          var distanceSquared = dx * dx + dy * dy;
          if (distanceSquared &lt; nearestDistance) {
            nearestDistance = distanceSquared;
            nearest = paper;
          }
        });
        return nearestDistance &lt;= 24 * 24 ? nearest : null;
      }

      function renderChart() {
        hideTooltip();
        svg.selectAll(&quot;g, rect, circle, line, text&quot;).remove();

        var width = Math.max(320, Math.round(chartWrap.getBoundingClientRect().width));
        var height = width &lt; 480 ? 430 : Math.min(580, Math.max(480, Math.round(width * 0.62)));
        var margin = { top: 22, right: 22, bottom: 62, left: 68 };
        var frameLeft = margin.left;
        var frameRight = width - margin.right;
        var frameTop = margin.top;
        var frameBottom = height - margin.bottom;
        var visiblePoints = state.points.filter(function (paper) {
          return state.activeClusters.has(paper.macro_cluster);
        });
        var domainPoints = state.points.length ? state.points : [{ mds_x: 0, mds_y: 0 }];
        var xScale = d3.scaleLinear()
          .domain(paddedDomain(domainPoints.map(function (paper) { return paper.mds_x; })))
          .range([frameLeft + 8, frameRight - 8]);
        var yScale = d3.scaleLinear()
          .domain(paddedDomain(domainPoints.map(function (paper) { return paper.mds_y; })))
          .range([frameBottom - 8, frameTop + 8]);
        var xTicks = width &lt;= 360 ? 4 : 6;

        svg
          .attr(&quot;viewBox&quot;, &quot;0 0 &quot; + width + &quot; &quot; + height)
          .attr(&quot;width&quot;, width)
          .attr(&quot;height&quot;, height)
          .style(&quot;height&quot;, height + &quot;px&quot;)
          .attr(
            &quot;aria-label&quot;,
            state.points.length + &quot; papers in the &quot; + state.corpus +
            &quot; corpus using the &quot; + state.method + &quot; representation&quot;
          );
        description.textContent =
          &quot;Each dot is one paper. Colors mark &quot; +
          new Set(state.points.map(function (paper) { return paper.macro_cluster; })).size +
          &quot; macroclusters; hover for the paper and its nested subcluster.&quot;;

        svg.append(&quot;rect&quot;)
          .attr(&quot;class&quot;, &quot;epcm-chart-frame&quot;)
          .attr(&quot;data-chart-frame&quot;, &quot;&quot;)
          .attr(&quot;x&quot;, frameLeft)
          .attr(&quot;y&quot;, frameTop)
          .attr(&quot;width&quot;, frameRight - frameLeft)
          .attr(&quot;height&quot;, frameBottom - frameTop);

        svg.append(&quot;g&quot;)
          .attr(&quot;class&quot;, &quot;epcm-axis&quot;)
          .attr(&quot;transform&quot;, &quot;translate(0,&quot; + frameBottom + &quot;)&quot;)
          .call(d3.axisBottom(xScale).ticks(xTicks).tickSizeOuter(0));

        svg.append(&quot;g&quot;)
          .attr(&quot;class&quot;, &quot;epcm-axis&quot;)
          .attr(&quot;transform&quot;, &quot;translate(&quot; + frameLeft + &quot;,0)&quot;)
          .call(d3.axisLeft(yScale).ticks(5).tickSizeOuter(0));

        svg.append(&quot;text&quot;)
          .attr(&quot;class&quot;, &quot;epcm-axis-title&quot;)
          .attr(&quot;data-axis&quot;, &quot;x&quot;)
          .attr(&quot;text-anchor&quot;, &quot;middle&quot;)
          .attr(&quot;x&quot;, (frameLeft + frameRight) / 2)
          .attr(&quot;y&quot;, height - 12)
          .text(&quot;MDS axis 1 (relative distance)&quot;);

        svg.append(&quot;text&quot;)
          .attr(&quot;class&quot;, &quot;epcm-axis-title&quot;)
          .attr(&quot;data-axis&quot;, &quot;y&quot;)
          .attr(&quot;text-anchor&quot;, &quot;middle&quot;)
          .attr(&quot;transform&quot;, &quot;translate(16,&quot; + ((frameTop + frameBottom) / 2) + &quot;) rotate(-90)&quot;)
          .text(&quot;MDS axis 2 (relative distance)&quot;);

        var orderedPoints = visiblePoints.slice().sort(function (left, right) {
          return Number(left.verdict === &quot;INCLUDE&quot;) - Number(right.verdict === &quot;INCLUDE&quot;);
        });
        var pointLayer = svg.append(&quot;g&quot;).attr(&quot;aria-hidden&quot;, &quot;true&quot;);
        pointLayer.selectAll(&quot;circle&quot;)
          .data(orderedPoints, function (paper) { return paper.work_id; })
          .join(&quot;circle&quot;)
          .attr(&quot;class&quot;, &quot;epcm-point&quot;)
          .attr(&quot;cx&quot;, function (paper) { return xScale(paper.mds_x); })
          .attr(&quot;cy&quot;, function (paper) { return yScale(paper.mds_y); })
          .attr(&quot;r&quot;, state.corpus === &quot;audited&quot; ? 3.8 : 4.7)
          .attr(&quot;fill&quot;, function (paper) {
            return paper.verdict === &quot;INCLUDE&quot;
              ? colorForCluster(paper.macro_cluster)
              : &quot;var(--background)&quot;;
          })
          .attr(&quot;stroke&quot;, function (paper) {
            return paper.verdict === &quot;INCLUDE&quot;
              ? &quot;var(--background)&quot;
              : colorForCluster(paper.macro_cluster);
          })
          .attr(&quot;stroke-width&quot;, function (paper) {
            return paper.verdict === &quot;INCLUDE&quot; ? 0.8 : 1.35;
          })
          .attr(&quot;opacity&quot;, 0.86);

        var grouped = d3.groups(visiblePoints, function (paper) {
          return paper.macro_cluster;
        }).sort(function (left, right) {
          return d3.ascending(left[0], right[0]);
        });
        var clusterLayer = svg.append(&quot;g&quot;).attr(&quot;aria-hidden&quot;, &quot;true&quot;);
        clusterLayer.selectAll(&quot;text&quot;)
          .data(grouped)
          .join(&quot;text&quot;)
          .attr(&quot;class&quot;, &quot;epcm-cluster-label&quot;)
          .attr(&quot;x&quot;, function (group) {
            var meanX = d3.mean(group[1], function (paper) { return paper.mds_x; });
            var meanY = d3.mean(group[1], function (paper) { return paper.mds_y; });
            var anchor = d3.least(group[1], function (paper) {
              return Math.pow(paper.mds_x - meanX, 2) + Math.pow(paper.mds_y - meanY, 2);
            });
            return xScale(anchor.mds_x) + 6;
          })
          .attr(&quot;y&quot;, function (group) {
            var meanX = d3.mean(group[1], function (paper) { return paper.mds_x; });
            var meanY = d3.mean(group[1], function (paper) { return paper.mds_y; });
            var anchor = d3.least(group[1], function (paper) {
              return Math.pow(paper.mds_x - meanX, 2) + Math.pow(paper.mds_y - meanY, 2);
            });
            return yScale(anchor.mds_y) - 6;
          })
          .text(function (group) { return group[0]; });

        var selectedMarker = svg.append(&quot;circle&quot;)
          .attr(&quot;class&quot;, &quot;epcm-selected-marker&quot;)
          .attr(&quot;r&quot;, 8)
          .attr(&quot;display&quot;, &quot;none&quot;);
        if (
          state.selected &amp;&amp;
          state.activeClusters.has(state.selected.macro_cluster) &amp;&amp;
          state.selected.corpus === state.corpus &amp;&amp;
          state.selected.method === state.method
        ) {
          selectedMarker
            .attr(&quot;cx&quot;, xScale(state.selected.mds_x))
            .attr(&quot;cy&quot;, yScale(state.selected.mds_y))
            .attr(&quot;display&quot;, null);
        }

        var hoverMarker = svg.append(&quot;circle&quot;)
          .attr(&quot;class&quot;, &quot;epcm-hover-marker&quot;)
          .attr(&quot;data-chart-hover-marker&quot;, &quot;&quot;)
          .attr(&quot;r&quot;, 7)
          .attr(&quot;display&quot;, &quot;none&quot;);

        svg.append(&quot;rect&quot;)
          .attr(&quot;class&quot;, &quot;epcm-hit&quot;)
          .attr(&quot;data-chart-hit&quot;, &quot;&quot;)
          .attr(&quot;data-chart-hover-overlay&quot;, &quot;nearest-point&quot;)
          .attr(&quot;x&quot;, frameLeft)
          .attr(&quot;y&quot;, frameTop)
          .attr(&quot;width&quot;, frameRight - frameLeft)
          .attr(&quot;height&quot;, frameBottom - frameTop)
          .on(&quot;pointermove&quot;, function (event) {
            var paper = nearestPoint(event, xScale, yScale, visiblePoints);
            if (!paper) {
              hoverMarker.attr(&quot;display&quot;, &quot;none&quot;);
              hideTooltip();
              return;
            }
            hoverMarker
              .attr(&quot;cx&quot;, xScale(paper.mds_x))
              .attr(&quot;cy&quot;, yScale(paper.mds_y))
              .attr(&quot;display&quot;, null);
            showTooltip(event, paper);
          })
          .on(&quot;pointerleave&quot;, function () {
            hoverMarker.attr(&quot;display&quot;, &quot;none&quot;);
            hideTooltip();
          })
          .on(&quot;click&quot;, function (event) {
            var paper = nearestPoint(event, xScale, yScale, visiblePoints);
            if (!paper) {
              return;
            }
            state.selected = paper;
            selectedMarker
              .attr(&quot;cx&quot;, xScale(paper.mds_x))
              .attr(&quot;cy&quot;, yScale(paper.mds_y))
              .attr(&quot;display&quot;, null);
            renderSelection();
          });
      }

      function refreshView() {
        state.corpus = corpusControl.value;
        state.method = methodControl.value;
        state.points = points.filter(function (paper) {
          return paper.corpus === state.corpus &amp;&amp; paper.method === state.method;
        });
        var groups = d3.groups(state.points, function (paper) {
          return paper.macro_cluster;
        }).sort(function (left, right) {
          return d3.ascending(left[0], right[0]);
        });
        state.activeClusters = new Set(groups.map(function (group) { return group[0]; }));
        state.selected = null;
        countLabel.textContent =
          state.points.length + &quot; papers · &quot; + groups.length + &quot; macroclusters&quot;;
        statusKey.classList.toggle(&quot;is-visible&quot;, state.corpus === &quot;audited&quot;);
        drawLegend(groups);
        renderSelection();
        renderChart();
      }

      corpusControl.addEventListener(&quot;change&quot;, refreshView);
      methodControl.addEventListener(&quot;change&quot;, refreshView);

      var resizeObserver = new ResizeObserver(function () {
        if (resizeFrame !== null) {
          cancelAnimationFrame(resizeFrame);
        }
        resizeFrame = requestAnimationFrame(function () {
          resizeFrame = null;
          renderChart();
        });
      });
      resizeObserver.observe(chartWrap);

      refreshView();
    }());
  &lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
